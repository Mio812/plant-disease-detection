[project]
name = "plant-disease-detection"
version = "0.1.0"
description = "COMP9444 plant disease detection and severity estimation with PyTorch CNNs."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

# PyTorch build selection: sync exactly one of these extras.
#   uv sync --extra cu130   (NVIDIA GPU; CUDA 13.0 wheels, supports RTX 50-series)
#   uv sync --extra cpu     (CPU-only wheels)
[project.optional-dependencies]
cpu = ["torch>=2.0", "torchvision>=0.15"]
cu130 = ["torch>=2.9", "torchvision>=0.24"]

[dependency-groups]
dev = ["jupyter>=1.0", "ipykernel>=6.0", "ruff>=0.6"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
docstring-code-format = true
