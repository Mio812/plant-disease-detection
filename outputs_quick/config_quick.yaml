seed: 42
output_dir: outputs_quick
data:
  root: data/PlantVillage/raw/color
  image_size: 128
  val_split: 0.15
  test_split: 0.15
  batch_size: 96
  num_workers: 10
model:
  name: resnet18
  pretrained: true
train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1
  early_stop_patience: 7
severity:
  thresholds:
  - 0.05
  - 0.2
  - 0.5
  levels:
  - healthy
  - mild
  - moderate
  - severe
